# Local lab: Keycloak (OIDC provider) + the notes API.
# Start:  podman compose up --build   (or docker compose up --build)
# Test users and their local-only passwords are in keycloak/notes-realm.json.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    command: start-dev --import-realm --http-port 8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/notes-realm.json:/opt/keycloak/data/import/notes-realm.json:ro
    ports:
      - "8180:8180"

  api:
    build: ./app
    environment:
      # Inside compose the API reaches Keycloak by service name; tokens must be minted
      # with the same issuer, so fetch them from http://keycloak:8180 too (see LEARNING.md, day 1).
      OIDC_ISSUER: http://keycloak:8180/realms/notes
    ports:
      - "8080:8080"
    depends_on:
      - keycloak
