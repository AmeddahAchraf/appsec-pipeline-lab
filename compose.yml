# Local lab: Keycloak (OIDC provider) + the notes API.
# Start:  podman compose up --build   (or docker compose up --build)
# Test users and their local-only passwords are in keycloak/notes-realm.json.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    command: start-dev --import-realm --http-port 8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Pin the issuer to the URL clients on the host use, whatever host name a request arrives on.
      KC_HOSTNAME: http://localhost:8180
    volumes:
      - ./keycloak/notes-realm.json:/opt/keycloak/data/import/notes-realm.json:ro
    ports:
      - "8180:8180"

  api:
    build: ./app
    environment:
      # Tokens carry iss=http://localhost:8180/realms/notes (see KC_HOSTNAME above), so the API checks
      # that issuer. It cannot reach localhost:8180 from inside its container, so it fetches the
      # signing keys from Keycloak by service name instead.
      OIDC_ISSUER: http://localhost:8180/realms/notes
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/notes/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      - keycloak
