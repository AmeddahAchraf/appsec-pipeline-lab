spring.application.name=notes-api
# Keycloak realm from compose.yml. Override with OIDC_ISSUER in other environments.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8180/realms/notes}
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
server.error.include-message=never
server.error.include-stacktrace=never
