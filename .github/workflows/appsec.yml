name: appsec

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit and security tests (SR-01..SR-05)
        working-directory: app
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: app/target/notes-api-*.jar

  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.95.0
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/java --config p/owasp-top-ten --sarif --output semgrep.sarif app/
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep
          path: semgrep.sarif

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency scan
        run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.56.2
          fs --scanners vuln --format json --output /src/trivy.json /src/app
      - uses: actions/upload-artifact@v4
        with:
          name: trivy
          path: trivy.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (full history)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source /repo --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 0
      - uses: actions/upload-artifact@v4
        with:
          name: gitleaks
          path: gitleaks.sarif

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPDX SBOM
        run: docker run --rm -v "$PWD:/src" anchore/syft:v1.16.0 dir:/src/app -o spdx-json=/src/sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  dast:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dast
      - name: ZAP baseline against the running API
        # The ZAP image ships a JRE, so the app runs next to ZAP in one container.
        run: |
          mv dast/notes-api-*.jar dast/app.jar
          chmod 777 dast
          docker run --rm -v "$PWD/dast:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable bash -c \
            "java -jar /zap/wrk/app.jar > /zap/wrk/app.log 2>&1 &
             for i in \$(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done;
             zap-baseline.py -t http://localhost:8080 -J zap.json -I"
      - uses: actions/upload-artifact@v4
        with:
          name: zap
          path: dast/zap.json

  triage:
    runs-on: ubuntu-latest
    needs: [sast, sca, secrets, dast]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: findings
          merge-multiple: true
      - name: Rank findings by KEV, EPSS and CVSS
        run: >
          python3 triage/prioritize.py
          --trivy findings/trivy.json
          --sarif findings/semgrep.sarif findings/gitleaks.sarif
          --zap findings/zap.json
          --out triage-report.md --fail-on P1
      - name: Publish report
        if: always()
        run: cat triage-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-report
          path: triage-report.md
